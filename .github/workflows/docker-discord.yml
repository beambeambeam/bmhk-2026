name: Build discord Docker image

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: docker-discord-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/discord

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify CI passed for main
        if: ${{ github.ref_name == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          success_count="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&head_sha=${TARGET_SHA}&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          test "$success_count" -gt 0 || {
            echo "CI has not passed for main commit ${TARGET_SHA}."
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha

      - name: Set build timestamp
        run: |
          echo "NOW=$(date +'%Y-%m-%dT%H:%M:%S')" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/discord/Dockerfile
          push: true
          build-args: |
            BMHK_ENV=${{ github.ref_name == 'staging' && 'staging' || 'production' }}
            COMMIT_SHA=${{ github.sha }}
            COMMIT_MSG=${{ github.event.head_commit.message }}
            BUILD_TRIGGERED_BY=${{ github.actor }}
            BUILD_TIMESTAMP=${{ env.NOW }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
