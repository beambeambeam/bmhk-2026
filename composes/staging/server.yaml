services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${PG_DBNAME:-bmhk-2026}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
    volumes:
      - bmhk-2026_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    image: ghcr.io/beambeambeam/bmhk-2026/server:staging
    pull_policy: always
    container_name: bmhk-2026-server
    environment:
      NODE_ENV: production
      PORT: 3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      DATABASE_URL: postgresql://${PG_USER:-postgres}:${PG_PASSWORD}@postgres:5432/${PG_DBNAME:-bmhk-2026}
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:?AWS_ENDPOINT_URL_S3 is required}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET is required}
      BMHK_ENVIRONMENT: staging
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  pg-backup:
    image: itbm/postgres-backup-s3:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SCHEDULE=${PGBK_SCHEDULE:-@daily}
      - DELETE_OLDER_THAN=${PGBK_DELETE_OLDER_THAN:-}
      - ENCRYPTION_PASSWORD=${PGBK_ENCRYPTION_PASSWORD:?PGBK_ENCRYPTION_PASSWORD is required}
      - POSTGRES_HOST=postgres
      - POSTGRES_DATABASE=${PG_DBNAME:-bmhk-2026}
      - POSTGRES_USER=${PG_USER:-postgres}
      - POSTGRES_PASSWORD=${PG_PASSWORD:?PG_PASSWORD is required}
      - S3_BUCKET=${PGBK_S3_BUCKET:?PGBK_S3_BUCKET is required}
      - S3_PREFIX=${PGBK_S3_PREFIX:?PGBK_S3_PREFIX is required. Example backups/staging}
      - S3_REGION=${PGBK_S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${PGBK_S3_ACCESS_KEY:?PGBK_S3_ACCESS_KEY is required}
      - S3_SECRET_ACCESS_KEY=${PGBK_S3_SECRET_KEY:?PGBK_S3_SECRET_KEY is required}
      - S3_ENDPOINT=${PGBK_S3_ENDPOINT:?PGBK_S3_ENDPOINT is required}
      - S3_S3V4=yes

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run --protocol http2
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN_SERVER:?CF_TUNNEL_TOKEN_SERVER is required}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
volumes:
  bmhk-2026_postgres_data:
