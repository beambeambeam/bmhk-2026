name: bmhk-2026

services:
  postgres:
    image: postgres:18
    container_name: bmhk-2026-postgres
    environment:
      POSTGRES_DB: bmhk-2026
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - bmhk-2026_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  bmhk-2026_postgres_data:
